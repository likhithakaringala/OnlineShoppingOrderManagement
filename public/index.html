<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy | Online Shopping</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="brand">ShopEasy</div><nav>
  <button data-view="shop">Shop</button><button data-view="cart">Cart <span id="cart-count">0</span></button>
  <button data-view="orders">Order History</button><button data-view="admin" id="admin-nav" hidden>Admin</button>
  <span id="user-label">Guest</span><button id="logout-btn" hidden>Logout</button>
</nav></header>
<main>
  <section id="auth-panel" class="panel auth">
    <div><h2>Customer Login</h2><form id="login-form">
      <input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required>
      <button>Login</button></form></div>
    <div><h2>Create Account</h2><form id="register-form">
      <input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><button>Register</button>
    </form></div>
  </section>
  <p id="notice" role="status"></p>
  <section id="shop-view"><div class="section-head"><div><h1>Product Catalogue</h1><p>Find everyday essentials at great prices.</p></div>
    <input id="search" placeholder="Search products..." aria-label="Search products"></div><div id="products" class="products"></div></section>
  <section id="cart-view" hidden><h1>Shopping Cart</h1><div id="cart-items"></div><button id="checkout-btn">Proceed to Checkout</button></section>
  <section id="orders-view" hidden><h1>Order History</h1><div id="orders"></div></section>
  <section id="admin-view" hidden><h1>Admin Product Management</h1>
    <form id="product-form" class="product-form">
      <input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required>
      <input name="description" placeholder="Description"><input name="price" type="number" min="0" step="0.01" placeholder="Price" required>
      <input name="stock" type="number" min="0" placeholder="Stock" required><button>Add Product</button>
    </form><div id="admin-products"></div>
  </section>
</main>
<footer>ShopEasy · Online Shopping and Order Management System</footer>
<script src="app.js"></script>
</body></html>
